name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: CLI tests + lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install "pytest==9.1.1" "ruff==0.16.3"
      - name: Compile check
        run: |
          python3 -m py_compile corvus
          python3 -m py_compile corvus_cli/__init__.py corvus_cli/constants.py corvus_cli/config.py corvus_cli/api.py corvus_cli/output.py corvus_cli/parser.py corvus_cli/cli.py corvus_cli/commands/*.py
      - name: Run tests (pytest)
        run: pytest -q
      - name: Lint (ruff)
        run: ruff check corvus_cli corvus tests/

  rpm:
    name: RPM smoke build
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Install rpm-build
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM
        run: make rpm
