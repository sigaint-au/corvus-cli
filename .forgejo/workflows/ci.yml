name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: CLI tests + lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install "pytest==9.1.1" "ruff==0.16.3"
      - name: Compile check
        run: python3 -m py_compile corvus
      - name: Run tests (pytest)
        run: python3 -m pytest
      - name: Lint (ruff)
        run: python3 -m ruff check corvus tests/